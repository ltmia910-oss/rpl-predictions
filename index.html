<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Таблица прогнозов РПЛ</title>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js">
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0b0e14;
            color: #e9f1f7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .container {
            max-width: 420px;
            width: 100%;
            background: #11161f;
            border-radius: 24px;
            padding: 48px 32px;
            text-align: center;
            border: 1px solid #1a2230;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }
        .emoji-big {
            font-size: 56px;
            margin-bottom: 12px;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #f0b429;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #8aa0b2;
            font-size: 14px;
            margin-bottom: 32px;
        }
        .btn {
            padding: 14px 40px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }
        .btn-google {
            background: #4285f4;
            color: white;
        }
        .btn-google:hover {
            background: #357ae8;
            transform: scale(1.02);
        }
        .btn-google:active {
            transform: scale(0.98);
        }
        .hidden {
            display: none !important;
        }

        /* После входа показываем приветствие */
        .welcome {
            margin-top: 20px;
            padding: 16px;
            background: #1a2230;
            border-radius: 12px;
        }
        .welcome .name {
            font-size: 18px;
            font-weight: 600;
        }
        .welcome .email {
            color: #8aa0b2;
            font-size: 14px;
        }
        .flex-center {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn-logout {
            background: transparent;
            color: #8aa0b2;
            border: 1px solid #2d3748;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .btn-logout:hover {
            border-color: #ff5d5d;
            color: #ff5d5d;
        }
        .btn-primary {
            background: #f0b429;
            color: #0b0e14;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            font-weight: 600;
        }
        .btn-primary:hover {
            background: #dba020;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ===== ЭМОДЗИ И ЗАГОЛОВОК ===== -->
        <div class="emoji-big">⚽</div>
        <h1>Таблица прогнозов РПЛ</h1>
        <p class="subtitle">Войдите, чтобы начать</p>

        <!-- ===== НЕ АВТОРИЗОВАН ===== -->
        <div id="notLoggedIn">
            <button class="btn btn-google" id="loginBtn">
                🚀 Войти через Google
            </button>
        </div>

        <!-- ===== АВТОРИЗОВАН ===== -->
        <div id="loggedIn" class="hidden">
            <div class="welcome">
                <div style="font-size:40px; margin-bottom:4px;">👤</div>
                <div class="name" id="userName">Имя</div>
                <div class="email" id="userEmail">email@example.com</div>
            </div>

            <div class="flex-center">
                <button class="btn-primary" id="goToAppBtn">
                    📊 Таблица прогнозов
                </button>
                <button class="btn-logout" id="logoutBtn">
                    Выйти
                </button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================================
        // КОНФИГ FIREBASE
        // ==========================================================
        const firebaseConfig = {
            apiKey: "AIzaSyCXBoQRgeDTnU6HYGNpvnSL9Ct8B8uMhn0",
            authDomain: "rpl-predictions.firebaseapp.com",
            projectId: "rpl-predictions",
            storageBucket: "rpl-predictions.firebasestorage.app",
            messagingSenderId: "620763863804",
            appId: "1:620763863804:web:7eb0f0319c637c0c1cd579"
        };

        // ==========================================================
        // ИНИЦИАЛИЗАЦИЯ
        // ==========================================================
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // ==========================================================
        // DOM
        // ==========================================================
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const goToAppBtn = document.getElementById('goToAppBtn');
        const notLoggedIn = document.getElementById('notLoggedIn');
        const loggedIn = document.getElementById('loggedIn');
        const userName = document.getElementById('userName');
        const userEmail = document.getElementById('userEmail');

        // ==========================================================
        // UI
        // ==========================================================
        function updateUI(user) {
            if (user) {
                notLoggedIn.classList.add('hidden');
                loggedIn.classList.remove('hidden');
                userName.textContent = user.displayName || 'Пользователь';
                userEmail.textContent = user.email || '';
            } else {
                notLoggedIn.classList.remove('hidden');
                loggedIn.classList.add('hidden');
            }
        }

        auth.onAuthStateChanged(user => {
            updateUI(user);
        });

        // ==========================================================
        // СОБЫТИЯ
        // ==========================================================
        loginBtn.addEventListener('click', () => {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .catch(error => {
                    alert('Ошибка входа: ' + error.message);
                });
        });

        logoutBtn.addEventListener('click', () => {
            auth.signOut();
        });

        goToAppBtn.addEventListener('click', () => {
            alert('🚧 Таблица прогнозов появится позже!');
        });

        console.log('🔥 Firebase инициализирован!');
    </script>

</body>
</html>
